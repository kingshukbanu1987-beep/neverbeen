<span
  class="card-live-pill"
  [class.is-live]="hasLiveNow()"
  role="status"
  [attr.aria-label]="accessibleLabel()"
>
  <span class="card-live-pill-seg is-now" aria-hidden="true">
    <span class="card-live-pill-dot"></span>
    <b class="card-live-pill-value">{{ formatTotal(liveNow()) }}</b>
    <i class="card-live-pill-word">Live Now</i>
  </span>
  <span class="card-live-pill-divider" aria-hidden="true"></span>
  <span class="card-live-pill-seg is-past" aria-hidden="true">
    <span class="card-live-pill-bubble" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path
          class="card-live-pill-bubble-shape"
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
        />
        <circle class="card-live-pill-bubble-dot" cx="8.2" cy="11.5" r="1" />
        <circle class="card-live-pill-bubble-dot" cx="12" cy="11.5" r="1" />
        <circle class="card-live-pill-bubble-dot" cx="15.8" cy="11.5" r="1" />
      </svg>
    </span>
    <b class="card-live-pill-value">{{ formatTotal(pastChats()) }}</b>
    <i class="card-live-pill-word">{{ pastChats() === 1 ? 'past chat' : 'past chats' }}</i>
  </span>
</span>
