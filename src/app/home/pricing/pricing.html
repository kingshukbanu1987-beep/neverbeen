<section class="pricing" id="pricing">
  <div class="container">
    <app-section-heading
      align="center"
      eyebrow="Collections"
      title="Pricing"
      copy="Simple plans for a first postcard, a full trip, or a season of elsewhere."
    />
    <div class="grid">
      @for (plan of plans; track plan.name) {
        <app-pricing-card [plan]="plan" [isSelected]="selectedPlan() === plan.name" (selected)="choosePlan($event)" />
      }
    </div>
    @if (selectedPlan()) {
      <p class="note">
        {{ selectedPlan() }} is a beautiful place to start.
        <a routerLink="/" fragment="contact">Tell us where you have never been.</a>
      </p>
    }
  </div>
</section>
