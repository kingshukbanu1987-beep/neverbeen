<section class="gallery" id="gallery">
  <div class="container">
    <app-section-heading
      tone="ink"
      eyebrow="The proof"
      title="Gallery"
      copy="Example vacation stills—composed like editorial travel photographs, not generated novelties."
    />
    <div class="mosaic">
      @for (item of items; track item.title) {
        <figure>
          <img [src]="item.image" [alt]="item.title + ' in ' + item.location" />
          <figcaption>
            <strong>{{ item.title }}</strong>
            <span>{{ item.location }}</span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
