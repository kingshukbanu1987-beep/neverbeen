<section class="gallery" id="gallery">
  <div class="container">
    <app-section-heading
      cmsKey="home.gallery"
      tone="ink"
      eyebrow="The proof"
      title="Gallery"
      copy="Twenty stills drawn at random from the Neverbeen Collection—a new set every time you open this page."
    />
    <div class="mosaic">
      @for (photo of photographs; track photo.src) {
        <figure>
          <img [src]="photo.src" [alt]="photo.alt" loading="lazy" decoding="async" />
          <figcaption>
            <strong>{{ photo.title }}</strong>
            <span>{{ locationOf(photo) }}</span>
          </figcaption>
        </figure>
      }
    </div>
    <p class="mosaic-note">
      <span>
        Showing {{ photographs.length }} of {{ collectionSize }} photographs, reshuffled on every
        visit.
      </span>
      <a class="note-link" routerLink="/collection">See the whole collection</a>
    </p>
  </div>
</section>
