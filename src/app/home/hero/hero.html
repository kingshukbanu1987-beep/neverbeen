<section class="hero" id="home">
  <div class="container layout">
    <div class="copy">
      @if (eyebrow()) {
        <p class="eyebrow">{{ eyebrow() }}</p>
      }
      <h1>{{ title() }}</h1>
      @if (lede()) {
        <p class="lede">{{ lede() }}</p>
      }
      <!-- Labels and visibility are managed in Website Management; the storyline follows Brochure. -->
      @if (buttons().length) {
        <div class="actions">
          @for (b of buttons(); track b.id) {
            @if (b.id === 'documentation' || b.id === 'storyline') {
              <!-- Native same-tab navigation stays reliable after history restores
                   or a deployment replaces the lazy route's JavaScript chunk. -->
              <a [href]="b.path" [class]="'btn ' + b.cls">{{ b.label }}</a>
            } @else {
              <a [routerLink]="b.path" [fragment]="b.fragment" [class]="'btn ' + b.cls">{{
                b.label
              }}</a>
            }
          }
        </div>
      }
    </div>
    <figure class="frame">
      <img [src]="destination().image" [alt]="destination().caption" />
      <nav class="slide-controls" aria-label="Hero destinations">
        <button
          type="button"
          (click)="showPreviousDestination()"
          aria-label="Show previous destination"
        >
          Previous
        </button>
        <button type="button" (click)="showNextDestination()" aria-label="Show next destination">
          Next
        </button>
      </nav>
      <figcaption aria-live="polite">
        <span>{{ destination().place }}</span>
        <span>{{ destination().caption }}</span>
      </figcaption>
    </figure>
  </div>
</section>
