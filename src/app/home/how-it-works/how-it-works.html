<section class="how" id="how-it-works">
  <div class="container">
    <app-section-heading
      cmsKey="home.how"
      eyebrow="The studio process"
      title="How It Works"
      copy="Four quiet steps from a portrait on your phone to a photograph that looks like you left. Our team use latest high definition, efficient, limited and expensive AI Models and Algorithms to create your Photographs that nowhere people can detect it's AI generated. It will look real, that's a Promise from nowhere Team. Furthermore, we will test those photographs in different AI Detection Systems to ensure that it pass the test and Detection System unable to detect its AI generated."
    />
    <div class="steps">
      @for (step of steps(); track $index) {
        <article>
          <span>{{ step.number }}</span>
          <h3>{{ step.title }}</h3>
          <p>{{ step.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
