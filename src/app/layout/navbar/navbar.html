<header class="nav">
  <div class="bar container">
    <a routerLink="/" class="logo" (click)="close()" aria-label="NeverBeen home">
      <img ngSrc="/neverbeen-logo.png" width="150" height="75" alt="NeverBeen" priority />
    </a>
    <button type="button" class="menu" [attr.aria-expanded]="open()" (click)="toggle()">
      {{ open() ? 'Close' : 'Menu' }}
    </button>
    <nav [class.open]="open()">
      @for (link of links; track link.label) {
        <a
          [routerLink]="link.path"
          [fragment]="link.fragment"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !link.fragment }"
          [class.login]="link.label === 'Login'"
          (click)="close()"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </div>
</header>
