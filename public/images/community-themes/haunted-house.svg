<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" fill="none">
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#0a0e18"/>
      <stop offset="1" stop-color="#1b2436"/>
    </linearGradient>
    <radialGradient id="moonglow">
      <stop stop-color="#f2ecd8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f2ecd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="fog" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1440" height="960" fill="url(#night)"/>
  <g fill="#f2ecd8">
    <circle cx="190" cy="150" r="2" opacity=".6"/>
    <circle cx="360" cy="90" r="1.5" opacity=".5"/>
    <circle cx="540" cy="180" r="2" opacity=".45"/>
    <circle cx="720" cy="80" r="1.5" opacity=".5"/>
    <circle cx="905" cy="150" r="2" opacity=".4"/>
    <circle cx="1330" cy="420" r="1.5" opacity=".4"/>
    <circle cx="120" cy="420" r="1.5" opacity=".45"/>
    <circle cx="480" cy="300" r="1.5" opacity=".35"/>
  </g>
  <circle cx="1130" cy="220" r="170" fill="url(#moonglow)"/>
  <circle cx="1130" cy="220" r="88" fill="#f2ecd8"/>
  <circle cx="1104" cy="196" r="14" fill="#ddd5bc" opacity=".7"/>
  <circle cx="1156" cy="244" r="10" fill="#ddd5bc" opacity=".6"/>
  <circle cx="1138" cy="182" r="7" fill="#ddd5bc" opacity=".5"/>
  <!-- Bare trees -->
  <g stroke="#0a0d14" fill="none" stroke-linecap="round">
    <path d="M120 960V600q-40-70-90-100M120 690q60-40 80-100M120 640q-30-60-70-80" stroke-width="16"/>
    <path d="M1350 960V640q30-60 80-84M1350 730q-50-30-64-84" stroke-width="15"/>
  </g>
  <!-- Mansion -->
  <g>
    <path d="M330 960V560h780v400Z" fill="#10141f"/>
    <path d="M300 566l420-120 420 120Z" fill="#0c101a"/>
    <path d="M330 566 750 452l420 114" stroke="#1d2536" stroke-width="5" fill="none"/>
    <!-- Central tower -->
    <rect x="660" y="330" width="180" height="240" fill="#121724"/>
    <path d="M648 336 750 220l102 116Z" fill="#0c101a"/>
    <path d="M750 220v-52" stroke="#0c101a" stroke-width="8"/>
    <path d="M750 168l44 18-44 18Z" fill="#2a3550"/>
    <!-- Spires -->
    <path d="M330 566l-24-120 60 40Z" fill="#0c101a"/>
    <path d="M1170 566l24-120-60 40Z" fill="#0c101a"/>
    <!-- Windows: a few glow -->
    <g fill="#0c101a">
      <rect x="420" y="620" width="52" height="76" rx="6"/>
      <rect x="540" y="620" width="52" height="76" rx="6"/>
      <rect x="848" y="620" width="52" height="76" rx="6"/>
      <rect x="968" y="620" width="52" height="76" rx="6"/>
      <rect x="420" y="760" width="52" height="76" rx="6"/>
      <rect x="968" y="760" width="52" height="76" rx="6"/>
      <rect x="700" y="380" width="34" height="52" rx="6"/>
      <rect x="766" y="380" width="34" height="52" rx="6"/>
    </g>
    <g fill="#e8b95c">
      <rect x="696" y="470" width="42" height="62" rx="6" opacity=".95"/>
      <rect x="762" y="470" width="42" height="62" rx="6" opacity=".8"/>
      <rect x="660" y="700" width="180" height="104" rx="10" opacity=".9"/>
      <rect x="540" y="760" width="52" height="76" rx="6" opacity=".75"/>
    </g>
    <g stroke="#232c40" stroke-width="4">
      <path d="M750 700v104M660 752h180"/>
    </g>
  </g>
  <!-- Ground -->
  <path d="M0 960v-70q360-60 720-46t720 46v70H0Z" fill="#0b0f16"/>
  <!-- Ghost -->
  <g opacity=".55">
    <path d="M952 810v-70a44 44 0 0 1 88 0v70q-11-14-22 0t-22 0-22 0-22 0Z" fill="#e9edf4"/>
    <circle cx="976" cy="748" r="5" fill="#222c3e"/>
    <circle cx="1000" cy="748" r="5" fill="#222c3e"/>
  </g>
  <!-- Fog bands -->
  <g fill="#aebfd4" filter="url(#fog)">
    <ellipse cx="360" cy="880" rx="520" ry="46" opacity=".16"/>
    <ellipse cx="1020" cy="906" rx="560" ry="52" opacity=".2"/>
    <ellipse cx="720" cy="830" rx="420" ry="34" opacity=".12"/>
  </g>
</svg>
