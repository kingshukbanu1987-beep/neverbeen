  <circle cx="720" cy="470" r="262" fill="url(#globe)"/>
  <circle cx="720" cy="470" r="262" fill="url(#rim)"/>
  <circle cx="720" cy="470" r="262" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2.5"/>
  <!-- Graticule -->
  <g stroke="#22d3ee" stroke-opacity=".28" stroke-width="1.5">
    <ellipse cx="720" cy="470" rx="262" ry="88"/>
    <ellipse cx="720" cy="470" rx="262" ry="180"/>
    <path d="M458 470h524"/>
    <ellipse cx="720" cy="470" rx="88" ry="262"/>
    <ellipse cx="720" cy="470" rx="180" ry="262"/>
    <path d="M720 208v524"/>
