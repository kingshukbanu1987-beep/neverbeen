  <g stroke="url(#arc)" stroke-width="2.5" fill="none">
    <path d="M590 400Q660 300 740 330" opacity=".9"/>
    <path d="M740 330Q830 330 900 430" opacity=".9"/>
    <path d="M590 400Q600 520 640 620" opacity=".75"/>
    <path d="M640 620Q750 660 860 600" opacity=".9"/>
    <path d="M900 430Q910 520 860 600" opacity=".75"/>
    <path d="M590 400Q760 560 900 430" opacity=".35" stroke-dasharray="4 7"/>
