  <g fill="#2a7ba6" opacity=".5">
    <path d="M560 380q40-30 90-18 30 10 24 40-8 34-50 42-46 8-64-22-14-28 0-42Z"/>
    <path d="M700 560q36-18 74 0 30 14 18 48-14 36-56 34-38-2-44-36-4-32 8-46Z"/>
    <path d="M860 350q30-12 58 4 22 14 8 40-16 28-48 22-28-6-30-34-2-24 12-32Z"/>
    <path d="M880 560q26-8 48 8 16 14 4 36-14 24-40 18-24-6-26-30-2-22 14-32Z"/>
  </g>
  <!-- City nodes -->
  <g>
    <circle cx="590" cy="400" r="6" fill="#a5f3fc"/>
    <circle cx="590" cy="400" r="12" stroke="#a5f3fc" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="740" cy="330" r="6" fill="#a5f3fc"/>
    <circle cx="740" cy="330" r="12" stroke="#a5f3fc" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="900" cy="430" r="6" fill="#a5f3fc"/>
    <circle cx="900" cy="430" r="12" stroke="#a5f3fc" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="640" cy="620" r="6" fill="#a5f3fc"/>
    <circle cx="640" cy="620" r="12" stroke="#a5f3fc" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="860" cy="600" r="6" fill="#a5f3fc"/>
    <circle cx="860" cy="600" r="12" stroke="#a5f3fc" stroke-opacity=".5" stroke-width="2"/>
  </g>
