<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" fill="none">
  <defs>
    <radialGradient id="space" cx=".5" cy=".35" r="1">
      <stop stop-color="#0c2233"/>
      <stop offset="1" stop-color="#071019"/>
    </radialGradient>
    <radialGradient id="globe" cx=".38" cy=".32" r="1">
      <stop stop-color="#12517a"/>
      <stop offset=".6" stop-color="#0d3350"/>
      <stop offset="1" stop-color="#081d30"/>
    </radialGradient>
    <radialGradient id="rim">
      <stop stop-color="#22d3ee" stop-opacity="0" offset=".82"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="arc" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="960" fill="url(#space)"/>
  <g fill="#9fd8ea">
    <circle cx="140" cy="140" r="2" opacity=".6"/>
    <circle cx="320" cy="80" r="1.5" opacity=".5"/>
    <circle cx="520" cy="180" r="2" opacity=".4"/>
    <circle cx="1240" cy="120" r="2" opacity=".55"/>
    <circle cx="1380" cy="300" r="1.5" opacity=".5"/>
    <circle cx="90" cy="620" r="1.5" opacity=".5"/>
    <circle cx="1340" cy="720" r="2" opacity=".45"/>
    <circle cx="240" cy="840" r="1.5" opacity=".4"/>
    <circle cx="1160" cy="880" r="1.5" opacity=".4"/>
    <circle cx="680" cy="90" r="1.5" opacity=".45"/>
  </g>
  <!-- Dashed data ring -->
