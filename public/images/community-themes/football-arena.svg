    <g fill="#357a3d">
      <rect x="140" y="620" width="1160" height="60"/>
      <rect x="140" y="740" width="1160" height="60"/>
      <rect x="140" y="860" width="1160" height="60"/>
    </g>
    <g stroke="#ffffff" stroke-opacity=".92" stroke-width="5" fill="none">
