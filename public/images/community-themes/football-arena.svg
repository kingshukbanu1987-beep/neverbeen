<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" fill="none">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#dff0fa"/>
      <stop offset="1" stop-color="#c6e2f2"/>
    </linearGradient>
    <linearGradient id="bowl" x2="0" y2="1">
      <stop stop-color="#8494a8"/>
      <stop offset="1" stop-color="#6b7a90"/>
    </linearGradient>
    <pattern id="crowd" width="28" height="22" patternUnits="userSpaceOnUse">
      <rect width="28" height="22" fill="#5d6b80"/>
      <circle cx="7" cy="6" r="4" fill="#d94f5c"/>
      <circle cx="21" cy="6" r="4" fill="#4f8fd9"/>
      <circle cx="7" cy="16" r="4" fill="#f2c14e"/>
      <circle cx="21" cy="16" r="4" fill="#e8e8ee"/>
      <circle cx="14" cy="11" r="4" fill="#49b27c"/>
    </pattern>
    <radialGradient id="ball" cx=".35" cy=".3" r="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f1f4f7"/>
      <stop offset="1" stop-color="#ccd5dd"/>
    </radialGradient>
    <radialGradient id="lampGlow">
      <stop stop-color="#fff9c4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pitchClip">
      <path d="M460 560H980L1260 920H180Z"/>
    </clipPath>
    <clipPath id="ballClip">
      <circle cx="300" cy="790" r="95"/>
    </clipPath>
  </defs>
  <rect width="1440" height="960" fill="url(#sky)"/>
  <!-- Floodlights -->
  <g>
    <circle cx="140" cy="86" r="95" fill="url(#lampGlow)"/>
    <circle cx="1300" cy="86" r="95" fill="url(#lampGlow)"/>
    <g fill="#46536a">
      <rect x="134" y="106" width="12" height="130" rx="4"/>
      <rect x="1294" y="106" width="12" height="130" rx="4"/>
    </g>
    <g>
      <rect x="96" y="58" width="88" height="52" rx="10" fill="#37445a"/>
      <rect x="1256" y="58" width="88" height="52" rx="10" fill="#37445a"/>
      <g fill="#fffde7">
        <circle cx="114" cy="74" r="7"/><circle cx="140" cy="74" r="7"/><circle cx="166" cy="74" r="7"/>
        <circle cx="114" cy="94" r="7"/><circle cx="140" cy="94" r="7"/><circle cx="166" cy="94" r="7"/>
        <circle cx="1274" cy="74" r="7"/><circle cx="1300" cy="74" r="7"/><circle cx="1326" cy="74" r="7"/>
        <circle cx="1274" cy="94" r="7"/><circle cx="1300" cy="94" r="7"/><circle cx="1326" cy="94" r="7"/>
      </g>
    </g>
