      <path d="M720 588V892"/>
      <ellipse cx="720" cy="740" rx="95" ry="42"/>
      <path d="M612 588v74h216v-74M592 662q128 40 256 0" />
      <path d="M655 588v34h130v-34"/>
      <path d="M480 892v-84h480v84M455 808q265-52 530 0"/>
      <path d="M600 892v-34h240v-34" />
    </g>
    <circle cx="720" cy="740" r="8" fill="#ffffff" opacity=".92"/>
  </g>
  <!-- Foreground grass -->
  <rect x="0" y="912" width="1440" height="48" fill="#2e6b35"/>
  <!-- Football -->
  <g>
    <ellipse cx="306" cy="894" rx="104" ry="20" fill="#14301c" opacity=".22"/>
    <circle cx="300" cy="790" r="95" fill="url(#ball)"/>
    <g clip-path="url(#ballClip)">
      <g fill="#1f2937">
        <path d="M300 762l28 20-11 33h-34l-11-33Z"/>
        <path d="M300 668l34 22-24 26-20-10-20 10-24-26Z" transform="translate(0 20)"/>
        <path d="M412 796l-10 38-34-8 6-24 22-12Z"/>
        <path d="M356 872l-24 26-28-20 16-22 20-2Z"/>
        <path d="M244 872l24 26 28-20-16-22-20-2Z"/>
        <path d="M188 796l10 38 34-8-6-24-22-12Z"/>
      </g>
      <g stroke="#1f2937" stroke-width="5" fill="none">
        <path d="M300 795v-33M272 782l-30-16M328 782l30-16M289 815l-18 28M311 815l18 28"/>
