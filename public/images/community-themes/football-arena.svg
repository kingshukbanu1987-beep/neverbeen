  <!-- Stadium bowl -->
  <path d="M40 320Q720 170 1400 320V368H40Z" fill="#46536a"/>
  <rect x="40" y="364" width="1360" height="206" fill="url(#bowl)"/>
  <rect x="40" y="376" width="1360" height="182" fill="url(#crowd)"/>
  <g stroke="#46536a" stroke-width="6">
    <path d="M40 440h1360M40 500h1360"/>
  </g>
  <rect x="40" y="556" width="1360" height="20" fill="#f5f7fa"/>
  <!-- Far goal with net -->
  <g>
    <rect x="652" y="512" width="136" height="52" fill="#eef2f6" opacity=".55"/>
    <g stroke="#b9c4d0" stroke-width="2" opacity=".8">
      <path d="M668 512v52M684 512v52M700 512v52M716 512v52M732 512v52M748 512v52M764 512v52M780 512v52"/>
      <path d="M652 526h136M652 540h136M652 554h136"/>
    </g>
    <path d="M648 564V508M792 564V508M648 508h144" stroke="#ffffff" stroke-width="6"/>
  </g>
  <!-- Pitch -->
  <g clip-path="url(#pitchClip)">
