  <g>
    <path d="M186 916v-34" stroke="#ffffff" stroke-width="4"/>
    <path d="M186 882l26 8-26 8Z" fill="#d94f5c"/>
    <path d="M1254 916v-34" stroke="#ffffff" stroke-width="4"/>
    <path d="M1254 882l26 8-26 8Z" fill="#d94f5c"/>
