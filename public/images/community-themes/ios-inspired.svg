<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" fill="none">
  <defs>
    <linearGradient id="iosbg" x2="0" y2="1">
      <stop stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#e7ebf1"/>
    </linearGradient>
    <linearGradient id="ioscard" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="iosblue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#0062cc"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1c1c1e" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1440" height="960" fill="url(#iosbg)"/>

  <!-- Soft ambience blobs -->
  <circle cx="180" cy="150" r="230" fill="#007aff" opacity="0.05"/>
  <circle cx="1330" cy="820" r="260" fill="#5856d6" opacity="0.05"/>

  <!-- Home-screen style card grid -->
  <g filter="url(#soft)">
    <!-- Large featured card -->
    <rect x="120" y="150" width="430" height="560" rx="30" fill="url(#ioscard)"/>
    <!-- App-icon tiles on the featured card -->
    <g>
      <rect x="160" y="196" width="88" height="88" rx="22" fill="url(#iosblue)"/>
      <rect x="268" y="196" width="88" height="88" rx="22" fill="#34c759" opacity="0.9"/>
      <rect x="376" y="196" width="88" height="88" rx="22" fill="#ff9f0a" opacity="0.9"/>
      <rect x="160" y="304" width="88" height="88" rx="22" fill="#5856d6" opacity="0.9"/>
      <rect x="268" y="304" width="88" height="88" rx="22" fill="#ff375f" opacity="0.85"/>
      <rect x="376" y="304" width="88" height="88" rx="22" fill="#64d2ff" opacity="0.9"/>
    </g>
    <!-- Text lines -->
    <rect x="160" y="440" width="300" height="20" rx="10" fill="#1c1c1e" opacity="0.75"/>
    <rect x="160" y="480" width="350" height="14" rx="7" fill="#8e8e93" opacity="0.7"/>
    <rect x="160" y="508" width="280" height="14" rx="7" fill="#8e8e93" opacity="0.5"/>
    <!-- Pill button -->
    <rect x="160" y="620" width="170" height="52" rx="26" fill="url(#iosblue)"/>
    <rect x="188" y="641" width="114" height="10" rx="5" fill="#ffffff" opacity="0.9"/>

    <!-- Right column: two stacked cards -->
    <rect x="590" y="150" width="300" height="268" rx="26" fill="url(#ioscard)"/>
    <circle cx="646" cy="216" r="24" fill="#007aff" opacity="0.16"/>
    <rect x="686" y="200" width="150" height="14" rx="7" fill="#1c1c1e" opacity="0.7"/>
    <rect x="686" y="224" width="110" height="12" rx="6" fill="#8e8e93" opacity="0.6"/>
    <rect x="622" y="286" width="236" height="10" rx="5" fill="#d3dae4"/>
    <rect x="622" y="308" width="200" height="10" rx="5" fill="#d3dae4"/>
    <rect x="622" y="330" width="216" height="10" rx="5" fill="#d3dae4"/>
    <rect x="622" y="362" width="96" height="32" rx="16" fill="#007aff" opacity="0.9"/>

    <rect x="590" y="442" width="300" height="268" rx="26" fill="url(#ioscard)"/>
    <circle cx="646" cy="508" r="24" fill="#34c759" opacity="0.18"/>
    <rect x="686" y="492" width="140" height="14" rx="7" fill="#1c1c1e" opacity="0.7"/>
    <rect x="686" y="516" width="120" height="12" rx="6" fill="#8e8e93" opacity="0.6"/>
    <rect x="622" y="578" width="236" height="10" rx="5" fill="#d3dae4"/>
    <rect x="622" y="600" width="190" height="10" rx="5" fill="#d3dae4"/>
    <rect x="622" y="632" width="216" height="10" rx="5" fill="#d3dae4"/>
    <rect x="622" y="654" width="96" height="32" rx="16" fill="#34c759" opacity="0.85"/>

    <!-- Bottom wide card -->
    <rect x="930" y="150" width="390" height="560" rx="30" fill="url(#ioscard)"/>
    <rect x="970" y="196" width="310" height="170" rx="20" fill="url(#iosblue)" opacity="0.14"/>
    <circle cx="1024" cy="262" r="26" fill="#007aff" opacity="0.55"/>
    <rect x="970" y="396" width="240" height="16" rx="8" fill="#1c1c1e" opacity="0.72"/>
    <rect x="970" y="430" width="310" height="12" rx="6" fill="#8e8e93" opacity="0.6"/>
    <rect x="970" y="456" width="270" height="12" rx="6" fill="#8e8e93" opacity="0.5"/>
    <rect x="970" y="482" width="290" height="12" rx="6" fill="#8e8e93" opacity="0.5"/>
    <rect x="970" y="600" width="180" height="56" rx="28" fill="#1c1c1e" opacity="0.85"/>
    <rect x="1000" y="624" width="120" height="10" rx="5" fill="#ffffff" opacity="0.9"/>

    <!-- Dock -->
    <rect x="120" y="756" width="1200" height="120" rx="34" fill="#ffffff" opacity="0.66"/>
    <rect x="540" y="784" width="64" height="64" rx="18" fill="url(#iosblue)"/>
    <rect x="640" y="784" width="64" height="64" rx="18" fill="#34c759" opacity="0.9"/>
    <rect x="740" y="784" width="64" height="64" rx="18" fill="#ff9f0a" opacity="0.9"/>
    <rect x="840" y="784" width="64" height="64" rx="18" fill="#5856d6" opacity="0.9"/>
  </g>
</svg>
