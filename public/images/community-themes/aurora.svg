<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" fill="none">
  <defs>
    <linearGradient id="polar" x2="0" y2="1">
      <stop stop-color="#04070f"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="aur1" x2="0" y2="1">
      <stop stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".55" stop-color="#34d399" stop-opacity=".8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="aur2" x2="0" y2="1">
      <stop stop-color="#818cf8" stop-opacity="0"/>
      <stop offset=".6" stop-color="#818cf8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="aur3" x2="0" y2="1">
      <stop stop-color="#c084fc" stop-opacity="0"/>
      <stop offset=".65" stop-color="#c084fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
