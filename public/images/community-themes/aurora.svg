    <circle cx="1080" cy="90" r="2" opacity=".65"/>
    <circle cx="1240" cy="190" r="1.5" opacity=".5"/>
    <circle cx="1380" cy="110" r="2" opacity=".7"/>
    <circle cx="180" cy="340" r="1.5" opacity=".5"/>
    <circle cx="1320" cy="340" r="1.5" opacity=".55"/>
    <circle cx="660" cy="260" r="1.5" opacity=".45"/>
    <circle cx="340" cy="430" r="1.5" opacity=".4"/>
    <circle cx="1140" cy="420" r="1.5" opacity=".45"/>
